<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">每一轮 LLM 调用的上下文</title>
  <desc id="desc">Prompt 从上到下依次拼接固定前缀、工作记忆、精简交互历史和当前用户请求。固定前缀在初始化后不变，工作记忆与交互历史随执行更新。</desc>
  <rect width="760" height="590" rx="20" fill="#f5f7fb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b45">
    <text x="380" y="45" text-anchor="middle" font-size="26" font-weight="700">每轮调用前，Harness 按顺序拼接 Prompt</text>
    <g stroke-width="1.5">
      <rect x="36" y="76" width="688" height="110" rx="12" fill="#e9f1ff" stroke="#9ab7e7"/>
      <rect x="36" y="200" width="688" height="110" rx="12" fill="#e6f4ee" stroke="#92c4ad"/>
      <rect x="36" y="324" width="688" height="110" rx="12" fill="#fff3df" stroke="#d9bc85"/>
      <rect x="36" y="448" width="688" height="82" rx="12" fill="#eeeafa" stroke="#b6a4da"/>
    </g>
    <g font-size="24" font-weight="600">
      <text x="60" y="112">1. 固定前缀</text>
      <text x="60" y="236">2. 工作记忆</text>
      <text x="60" y="360">3. 精简交互历史</text>
      <text x="60" y="483">4. 当前用户请求</text>
    </g>
    <g font-size="20" fill="#45576c">
      <text x="60" y="146">身份与规则、工具说明、格式示例、工作区概况</text>
      <text x="60" y="172">初始化时构建，后续保持不变</text>
      <text x="60" y="270">初始任务、最近操作的文件、简短笔记</text>
      <text x="60" y="296">随执行更新，让关键事实保持可见</text>
      <text x="60" y="394">之前的请求、模型回复、工具调用与结果</text>
      <text x="60" y="420">截短单条记录、去重，再限制总长度</text>
      <text x="60" y="515">明确本轮要解决的问题</text>
    </g>
    <text x="380" y="567" text-anchor="middle" font-size="21" font-weight="600">送入 LLM → 生成工具请求或最终回答</text>
  </g>
</svg>
