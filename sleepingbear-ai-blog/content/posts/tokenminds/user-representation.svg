<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="Georgia,'Times New Roman',serif">
  <rect x="0.5" y="0.5" width="899" height="389" rx="10" fill="#ffffff" stroke="#e2e2e2" stroke-width="1"/>

  <!-- ============ (a) Dense embedding ============ -->
  <text x="150" y="34" text-anchor="middle" font-size="15" fill="#1c3a5e" font-weight="bold">(a) Dense embedding</text>
  <text x="150" y="53" text-anchor="middle" font-size="12" fill="#777">today's industry standard</text>

  <rect x="45" y="70" width="210" height="86" rx="6" fill="#fdf6e3" stroke="#c9a227" stroke-width="1"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#555">user watch history</text>
  <text x="150" y="112" text-anchor="middle" font-size="12" fill="#333">cooking · guitar · F1 ·</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#333">woodworking · jazz · …</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#888">(1,200 watches)</text>

  <path d="M150 158 L150 182" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="60" y="188" width="180" height="46" rx="6" fill="#e8f0e4" stroke="#5b8c4a" stroke-width="1.5"/>
  <text x="150" y="209" text-anchor="middle" font-size="13" fill="#2d4a24">one 1,152-dim vector</text>
  <text x="150" y="226" text-anchor="middle" font-size="11" fill="#5b8c4a">[0.13, −0.42, 0.87, …]</text>

  <text x="150" y="264" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">✗ all interests squeezed</text>
  <text x="150" y="281" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">into one fixed vector</text>

  <!-- ============ (b) LLM text profile ============ -->
  <text x="450" y="34" text-anchor="middle" font-size="15" fill="#1c3a5e" font-weight="bold">(b) LLM text profile</text>
  <text x="450" y="53" text-anchor="middle" font-size="12" fill="#777">the emerging alternative</text>

  <rect x="345" y="70" width="210" height="86" rx="6" fill="#fdf6e3" stroke="#c9a227" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#555">user watch history</text>
  <text x="450" y="112" text-anchor="middle" font-size="12" fill="#333">cooking · guitar · F1 ·</text>
  <text x="450" y="130" text-anchor="middle" font-size="12" fill="#333">woodworking · jazz · …</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#888">(1,200 watches)</text>

  <path d="M450 158 L450 182" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="355" y="188" width="190" height="46" rx="6" fill="#f2ecf7" stroke="#7a5ba6" stroke-width="1.5"/>
  <text x="450" y="209" text-anchor="middle" font-size="12" fill="#4a326b">“likes cooking shows</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#4a326b">and motorsport”</text>

  <text x="450" y="264" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">✗ topical co-occurrence,</text>
  <text x="450" y="281" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">not sequential dynamics</text>

  <!-- ============ (c) TokenMinds ============ -->
  <text x="750" y="34" text-anchor="middle" font-size="15" fill="#1c3a5e" font-weight="bold">(c) TokenMinds</text>
  <text x="750" y="53" text-anchor="middle" font-size="12" fill="#777">dual output</text>

  <rect x="645" y="70" width="210" height="86" rx="6" fill="#fdf6e3" stroke="#c9a227" stroke-width="1"/>
  <text x="750" y="90" text-anchor="middle" font-size="12" fill="#555">user watch history</text>
  <text x="750" y="112" text-anchor="middle" font-size="12" fill="#333">cooking · guitar · F1 ·</text>
  <text x="750" y="130" text-anchor="middle" font-size="12" fill="#333">woodworking · jazz · …</text>
  <text x="750" y="148" text-anchor="middle" font-size="11" fill="#888">+ search queries</text>

  <path d="M700 158 L672 182" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M800 158 L828 182" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="633" y="188" width="112" height="46" rx="6" fill="#e8f0e4" stroke="#5b8c4a" stroke-width="1.5"/>
  <text x="689" y="207" text-anchor="middle" font-size="11.5" fill="#2d4a24">dense embed</text>
  <text x="689" y="224" text-anchor="middle" font-size="11" fill="#5b8c4a">(from encoder)</text>

  <rect x="757" y="188" width="112" height="46" rx="6" fill="#f2ecf7" stroke="#7a5ba6" stroke-width="1.5"/>
  <text x="813" y="207" text-anchor="middle" font-size="11.5" fill="#4a326b">40 user tokens</text>
  <text x="813" y="224" text-anchor="middle" font-size="11" fill="#7a5ba6">(from decoder)</text>

  <text x="750" y="264" text-anchor="middle" font-size="12" fill="#2a7" font-weight="bold">✓ many discrete interests,</text>
  <text x="750" y="281" text-anchor="middle" font-size="12" fill="#2a7" font-weight="bold">each grounded in a SID</text>

  <!-- ============ bottom banner ============ -->
  <line x1="45" y1="305" x2="855" y2="305" stroke="#e2e2e2" stroke-width="1"/>
  <text x="450" y="334" text-anchor="middle" font-size="13.5" fill="#1c3a5e">
    A user token is a <tspan font-style="italic">video SID prefix</tspan> — the same vocabulary already used to name videos.
  </text>
  <text x="450" y="358" text-anchor="middle" font-size="13.5" fill="#1c3a5e">
    So &#8220;this user&#8217;s next interest&#8221; is written in the same language as &#8220;this video.&#8221;
  </text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#666"/>
    </marker>
  </defs>
</svg>
